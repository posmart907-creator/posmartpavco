<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de administración · Catálogo</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,"Segoe UI",sans-serif;background:#eef2f6;color:#13202b}
header{background:#0b2a4a;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #d8dfe6;position:sticky;top:0;z-index:3}
input,select,button{font:inherit;padding:6px 8px;border:1px solid #c5ced7;border-radius:6px;background:#fff;color:inherit}
button{cursor:pointer;font-weight:600}.pri{background:#e8791a;border:0;color:#fff;padding:8px 14px}
details{background:#fff;margin:10px 16px;border:1px solid #d8dfe6;border-radius:8px;padding:10px 14px}
details label{display:block;margin:8px 0;font-weight:600}details input{width:100%;max-width:420px;display:block;margin-top:3px;font-weight:400}
.tw{overflow-x:auto;margin:0 16px 80px}table{border-collapse:collapse;width:100%;min-width:1050px;background:#fff}
th{background:#0b2a4a;color:#fff;text-align:left;padding:6px}td{border-bottom:1px solid #e3e8ed;padding:3px}td input,td select{width:100%}
td input.n{width:84px}td.c{text-align:center;white-space:nowrap}
#msg{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#13202b;color:#fff;font-weight:600;z-index:5}
</style>
</head>
<body>
<header><h1>Panel de administración · Catálogo Pavco</h1><button id="dl">Descargar productos.json</button><button class="pri" id="pub">Guardar y publicar en GitHub</button></header>
<details><summary><b>Ajustes</b> · tienda, WhatsApp y conexión con GitHub</summary>
<label>Nombre de la tienda<input id="ct"></label>
<label>WhatsApp que recibe los pedidos (con 51, sin espacios)<input id="cw" inputmode="numeric"></label>
<label>Repositorio (usuario/repositorio)<input id="gr" placeholder="miusuario/catalogo"></label>
<label>Rama<input id="gb" placeholder="main"></label>
<label>Token de GitHub (solo se guarda en este navegador)<input id="gt" type="password" autocomplete="off"></label>
</details>
<div class="bar">
<select id="fc"><option value="">Todas las categorías</option></select>
<input id="fq" type="search" placeholder="Buscar producto o medida">
<b>Ajustar precios</b><input id="pc" class="n" type="number" step="0.1" placeholder="%" style="width:80px"><button id="ap">Aplicar a lo filtrado</button>
<button id="add">+ Producto</button><span id="cn"></span>
</div>
<div class="tw"><table><thead><tr><th>Categoría</th><th>Grupo</th><th>Producto</th><th>Medida</th><th>Precio S/</th><th>Caja (und)</th><th>Bolsas por caja</th><th>UMV (tubos)</th><th>Descripción</th><th>Activo</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<datalist id="gl"></datalist><div id="msg" hidden></div>
<script>
const $=s=>document.querySelector(s),CATS={agua:"Agua",caliente:"Agua caliente",desague:"Desagüe",luz:"Luz"},NUM=["precio","caja","bolsa","umv"];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
let R,dirty=false,G={};try{G=JSON.parse(localStorage.getItem("gh")||"{}")}catch(e){}
const say=t=>{$("#msg").textContent=t;$("#msg").hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>$("#msg").hidden=true,6000)};
$("#fc").innerHTML+=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
const vis=()=>{const c=$("#fc").value,q=$("#fq").value.toLowerCase();return R.productos.map((p,i)=>({p,i})).filter(({p})=>(!c||p.cat===c)&&(!q||`${p.producto} ${p.medida} ${p.grupo}`.toLowerCase().includes(q)))};
const inp=(k,p)=>`<td><input data-k="${k}" value="${esc(p[k])}"${NUM.includes(k)?' type="number" step="any" class="n"':""}${k==="grupo"?' list="gl"':""}></td>`;
function draw(){const v=vis();$("#cn").textContent=v.length+" de "+R.productos.length+" filas";
  $("#gl").innerHTML=[...new Set(R.productos.map(p=>p.grupo))].map(g=>`<option value="${esc(g)}">`).join("");
  $("#tb").innerHTML=v.map(({p,i})=>`<tr data-i="${i}"><td><select data-k="cat">${Object.entries(CATS).map(([k,n])=>`<option value="${k}"${k===p.cat?" selected":""}>${n}</option>`).join("")}</select></td>${inp("grupo",p)}${inp("producto",p)}${inp("medida",p)}${inp("precio",p)}${inp("caja",p)}${inp("bolsa",p)}${inp("umv",p)}${inp("descripcion",p)}<td class="c"><input type="checkbox" data-k="activo"${p.activo!==false?" checked":""}></td><td class="c"><button data-a="d" title="Duplicar fila (para agregar otra medida)">⧉</button> <button data-a="x" title="Eliminar fila">✕</button></td></tr>`).join("")}
$("#tb").oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;const p=R.productos[+t.closest("tr").dataset.i];p[k]=t.type==="checkbox"?t.checked:NUM.includes(k)?(t.value===""?null:+t.value):t.value;dirty=true};
$("#tb").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.closest("tr").dataset.i;if(b.dataset.a==="d")R.productos.splice(i+1,0,{...R.productos[i]});else if(confirm("¿Eliminar esta fila? Si solo quieres ocultarla, desmarca Activo."))R.productos.splice(i,1);else return;dirty=true;draw()};
$("#fc").onchange=$("#fq").oninput=draw;
$("#add").onclick=()=>{$("#fq").value="";R.productos.push({cat:$("#fc").value||"agua",grupo:"",producto:"Nuevo producto",medida:"",precio:0,caja:null,bolsa:null,umv:null,descripcion:"",activo:true});dirty=true;draw();scrollTo(0,document.body.scrollHeight)};
$("#ap").onclick=()=>{const pc=+$("#pc").value,v=vis();if(!pc||!confirm(`¿Cambiar el precio de ${v.length} filas en ${pc}%?`))return;v.forEach(({p})=>p.precio=Math.round(p.precio*(1+pc/100)*100)/100);dirty=true;draw();say("Precios ajustados. Falta publicar.")};
const bind=(id,get,set)=>{$(id).value=get()||"";$(id).oninput=e=>set(e.target.value.trim())};
const json=()=>JSON.stringify(R,null,1)+"\n";
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json()],{type:"application/json"}));a.download="productos.json";a.click()};
$("#pub").onclick=async()=>{
  if(!G.repo||!G.token)return say("Completa repositorio y token en Ajustes.");
  const url=`https://api.github.com/repos/${G.repo}/contents/productos.json`,br=G.branch||"main",H={Authorization:"Bearer "+G.token,Accept:"application/vnd.github+json"};
  try{
    let sha;const r=await fetch(url+"?ref="+br,{headers:H});
    if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)return say(`Error ${r.status}: revisa el repositorio, la rama y el token.`);
    let b="";new TextEncoder().encode(json()).forEach(c=>b+=String.fromCharCode(c));
    const body={message:"Actualizar catálogo desde el panel",content:btoa(b),branch:br};if(sha)body.sha=sha;
    const w=await fetch(url,{method:"PUT",headers:H,body:JSON.stringify(body)});
    if(w.ok){dirty=false;say("Publicado. En 1 o 2 minutos se verá en la tienda.")}else say(`Error ${w.status} al guardar. El token necesita permiso Contents: Read and write.`);
  }catch(e){say("No se pudo conectar con GitHub.")}};
onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=""}};
(async()=>{try{R=await(await fetch("productos.json?"+Date.now())).json()}catch(e){document.body.innerHTML='<p style="padding:24px">No se pudo cargar productos.json. Abre este panel desde su dirección de GitHub Pages.</p>';return}
  bind("#ct",()=>R.config.tienda,v=>{R.config.tienda=v;dirty=true});bind("#cw",()=>R.config.whatsapp,v=>{R.config.whatsapp=v.replace(/\D/g,"");dirty=true});
  const sv=k=>v=>{G[k]=v;try{localStorage.setItem("gh",JSON.stringify(G))}catch(e){}};
  bind("#gr",()=>G.repo,sv("repo"));bind("#gb",()=>G.branch,sv("branch"));bind("#gt",()=>G.token,sv("token"));draw()})();
</script>
</body>
</html>
